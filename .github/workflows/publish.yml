name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check release tag
        run: node scripts/check-release.cjs
      - run: pnpm install --frozen-lockfile
      - name: Publish with npm trusted publishing
        run: pnpm publish --access public --provenance --no-git-checks --tag "$NPM_DIST_TAG"
